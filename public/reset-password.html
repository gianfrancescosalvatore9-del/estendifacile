<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reimposta password - EstendiFacile.it</title>
  <style>
    :root{
      --navy:#071d49;--green:#18b45a;--green-dark:#079447;
      --text:#0b1c39;--muted:#64748b;--border:#dfe8f4;--danger:#b91c1c;
      --shadow:0 26px 70px rgba(7,29,73,.10);--radius:28px;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;width:100%;min-height:100%;overflow-x:hidden;}
    body{
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      color:var(--text);
      background:radial-gradient(circle at 82% 20%,rgba(24,180,90,.08),transparent 30%),
        radial-gradient(circle at 8% 36%,rgba(37,99,235,.07),transparent 32%),
        linear-gradient(180deg,#ffffff 0%,#f7faff 100%);
      min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;
    }
    .card{
      width:100%;max-width:460px;background:#fff;border:1px solid var(--border);
      border-radius:var(--radius);box-shadow:var(--shadow);padding:40px 36px;position:relative;overflow:hidden;
    }
    .card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--green),#2563eb);}
    .logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
    .logo-sym{width:42px;height:42px;border:3px solid var(--green);border-radius:12px;display:grid;place-items:center;
      color:var(--navy);font-weight:950;font-size:17px;background:#fff;box-shadow:0 8px 20px rgba(7,29,73,.10);position:relative;}
    .logo-sym::after{content:"";position:absolute;right:-6px;bottom:-6px;width:14px;height:14px;border-radius:50%;
      background:var(--green);border:3px solid #fff;}
    .logo-text{font-weight:950;font-size:22px;letter-spacing:-1px;color:var(--navy);}
    .logo-text span{color:var(--green);}
    h1{margin:0 0 8px;font-size:26px;font-weight:950;letter-spacing:-.8px;color:var(--navy);}
    p.sub{margin:0 0 24px;color:var(--muted);font-size:14.5px;line-height:1.6;}
    label{display:block;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.3px;color:var(--navy);margin-bottom:6px;}
    .input-wrap{position:relative;margin-bottom:16px;}
    .input-wrap input{
      width:100%;height:52px;border:1.5px solid var(--border);border-radius:14px;
      padding:0 14px;font-size:15px;color:var(--text);outline:none;transition:.2s;background:#fff;
    }
    .input-wrap input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(24,180,90,.12);}
    .role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
    .role-btn{border:1.5px solid var(--border);border-radius:14px;background:#fff;padding:12px 8px;
      cursor:pointer;text-align:center;font-size:12px;font-weight:900;color:var(--navy);transition:.2s;}
    .role-btn.active{background:#effcf5;border-color:var(--green);color:var(--green);}
    .btn{width:100%;height:54px;border:none;border-radius:16px;background:var(--green);color:#fff;
      font-size:15px;font-weight:950;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;
      justify-content:center;gap:10px;transition:.2s;margin-top:4px;}
    .btn:hover{background:var(--green-dark);transform:translateY(-2px);}
    .btn:disabled{opacity:.7;cursor:not-allowed;transform:none;}
    .msg{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:14px;font-weight:700;display:none;}
    .msg.success{background:#ecfdf3;color:#07813e;border:1px solid #bbf7d0;display:block;}
    .msg.error{background:#fef2f2;color:var(--danger);border:1px solid #fecaca;display:block;}
    .back-link{display:block;text-align:center;margin-top:22px;font-size:13px;color:var(--muted);}
    .back-link a{color:var(--navy);font-weight:800;text-decoration:none;}
    .back-link a:hover{color:var(--green);}
    #stepConfirm{display:none;}
    .pw-bar{height:4px;border-radius:4px;background:#e4ebf5;overflow:hidden;margin-top:6px;}
    .pw-fill{height:100%;width:0;transition:width .3s,background .3s;border-radius:4px;}
    .pw-label{font-size:11px;margin-top:4px;color:var(--muted);}
    @keyframes spin{to{transform:rotate(360deg);}}
    .spin{animation:spin .8s linear infinite;width:18px;height:18px;}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-sym">EF</div>
      <div class="logo-text">Estendi<span>Facile</span></div>
    </div>

    <!-- Step 1: richiesta reset -->
    <div id="stepRequest">
      <h1>Password dimenticata?</h1>
      <p class="sub">Inserisci la tua email e la tua area di accesso. Ti manderemo un link per reimpostare la password.</p>

      <div class="role-grid">
        <button class="role-btn active" data-tipo="privato" type="button">Privato</button>
        <button class="role-btn" data-tipo="concessionario" type="button">Concessionario</button>
        <button class="role-btn" data-tipo="partner" type="button">Partner</button>
      </div>

      <label for="emailInput">Email</label>
      <div class="input-wrap">
        <input type="email" id="emailInput" placeholder="tua@email.com" autocomplete="email" />
      </div>

      <button class="btn" id="btnRequest" type="button">
        Invia istruzioni
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
      </button>
      <div class="msg" id="msgRequest"></div>
    </div>

    <!-- Step 2: nuova password (da URL con token) -->
    <div id="stepConfirm">
      <h1>Nuova password</h1>
      <p class="sub">Scegli una password sicura di almeno 10 caratteri.</p>

      <label for="pwInput">Nuova password</label>
      <div class="input-wrap">
        <input type="password" id="pwInput" placeholder="Almeno 10 caratteri" autocomplete="new-password" />
      </div>
      <div class="pw-bar"><div class="pw-fill" id="pwFill"></div></div>
      <div class="pw-label" id="pwLabel"></div>

      <label for="pwConfirm" style="margin-top:14px;">Conferma password</label>
      <div class="input-wrap">
        <input type="password" id="pwConfirm" placeholder="Ripeti la password" autocomplete="new-password" />
      </div>

      <button class="btn" id="btnConfirm" type="button" style="margin-top:8px;">
        Salva nuova password
      </button>
      <div class="msg" id="msgConfirm"></div>
    </div>

    <div class="back-link"><a href="/login.html">← Torna al login</a></div>
  </div>

  <script>
    // Determina quale step mostrare in base all'URL
    const params = new URLSearchParams(window.location.search);
    const resetToken = params.get("token");
    const resetTipo = params.get("tipo") || "concessionario";

    if (resetToken) {
      document.getElementById("stepRequest").style.display = "none";
      document.getElementById("stepConfirm").style.display = "block";
    }

    // Step 1 — selezione ruolo
    let selectedTipo = "privato";
    document.querySelectorAll(".role-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".role-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedTipo = btn.dataset.tipo;
      });
    });

    // Step 1 — invio richiesta
    document.getElementById("btnRequest").addEventListener("click", async () => {
      const email = document.getElementById("emailInput").value.trim();
      const msg = document.getElementById("msgRequest");
      const btn = document.getElementById("btnRequest");
      msg.className = "msg";
      msg.textContent = "";

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        msg.className = "msg error"; msg.textContent = "Inserisci un indirizzo email valido."; return;
      }

      const orig = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = 'Invio… <svg viewBox="0 0 24 24" class="spin" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>';

      try {
        const res = await fetch("/api/password-reset/request", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, tipo: selectedTipo })
        });
        const data = await res.json();
        msg.className = res.ok ? "msg success" : "msg error";
        msg.textContent = data.message || data.error || "Errore. Riprova.";
      } catch {
        msg.className = "msg error"; msg.textContent = "Errore di connessione. Riprova.";
      } finally {
        btn.disabled = false; btn.innerHTML = orig;
      }
    });

    // Step 2 — indicatore forza password
    const pwInput = document.getElementById("pwInput");
    const pwFill = document.getElementById("pwFill");
    const pwLabel = document.getElementById("pwLabel");
    if (pwInput) {
      pwInput.addEventListener("input", () => {
        const v = pwInput.value;
        let score = 0;
        if (v.length >= 10) score++;
        if (v.length >= 14) score++;
        if (/[A-Z]/.test(v)) score++;
        if (/[0-9]/.test(v)) score++;
        if (/[^A-Za-z0-9]/.test(v)) score++;
        const levels = [
          {w:"0%",c:"#e4ebf5",t:""},
          {w:"25%",c:"#ef4444",t:"Debole"},
          {w:"50%",c:"#f97316",t:"Accettabile"},
          {w:"75%",c:"#eab308",t:"Buona"},
          {w:"100%",c:"#22c55e",t:"Ottima"},
        ];
        const l = levels[Math.min(score, 4)];
        pwFill.style.width = l.w; pwFill.style.background = l.c; pwLabel.textContent = l.t;
      });
    }

    // Step 2 — conferma reset
    document.getElementById("btnConfirm").addEventListener("click", async () => {
      const pw = document.getElementById("pwInput").value;
      const pw2 = document.getElementById("pwConfirm").value;
      const msg = document.getElementById("msgConfirm");
      const btn = document.getElementById("btnConfirm");
      msg.className = "msg"; msg.textContent = "";

      if (pw.length < 10) { msg.className = "msg error"; msg.textContent = "La password deve avere almeno 10 caratteri."; return; }
      if (pw !== pw2) { msg.className = "msg error"; msg.textContent = "Le password non coincidono."; return; }

      const orig = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = 'Salvataggio…';

      try {
        const res = await fetch("/api/password-reset/confirm", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: resetToken, nuova_password: pw })
        });
        const data = await res.json();
        if (res.ok) {
          msg.className = "msg success";
          msg.textContent = data.message;
          btn.style.display = "none";
          setTimeout(() => window.location.href = "/login.html", 2500);
        } else {
          msg.className = "msg error"; msg.textContent = data.error || "Errore. Riprova.";
          btn.disabled = false; btn.innerHTML = orig;
        }
      } catch {
        msg.className = "msg error"; msg.textContent = "Errore di connessione. Riprova.";
        btn.disabled = false; btn.innerHTML = orig;
      }
    });
  </script>
</body>
</html>
